name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK (ANDROID_HOME); AGP fetches what it needs.
      - uses: gradle/actions/setup-gradle@v4

      # Without the KEYSTORE_* secrets, builds use a debug key; caching it keeps the signature
      # the same between builds so updates install over the previous version.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Fetch scenery photos
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/fetch_photos.py

      - uses: actions/upload-artifact@v4
        with:
          name: photo-sheet
          path: photo-sheet.jpg
          if-no-files-found: ignore

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Glass.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Glass.apk --title "Glass (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Install on Fire TV with Downloader: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Glass.apk" --latest
